<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Computer Short Courses - Cisco Printers</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        .coming-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2847, #1a3c6e);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .coming-container {
            width: 100%;
            max-width: 550px;
            background: #fff;
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
            border-top: 5px solid #f47b20;
            text-align: center;
        }

        .coming-icon {
            font-size: 4rem;
            color: #f47b20;
            margin-bottom: 16px;
        }

        .coming-container h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #1a3c6e;
            margin-bottom: 8px;
        }

        .coming-container h1 .highlight {
            color: #f47b20;
        }

        .coming-container p {
            color: #666;
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .coming-badge {
            display: inline-block;
            background: #fde8d6;
            color: #f47b20;
            padding: 8px 32px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            margin: 16px 0 8px;
            border: 2px solid #f47b20;
            letter-spacing: 2px;
        }

        .back-home {
            margin-top: 24px;
        }

        .back-home a {
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .back-home a:hover {
            color: #f47b20;
        }

        @media (max-width: 480px) {
            .coming-container { padding: 32px 24px; }
            .coming-container h1 { font-size: 1.6rem; }
            .coming-icon { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="coming-page">
        <div class="coming-container">
            <div class="coming-icon">
                <i class="fas fa-graduation-cap"></i>
            </div>

            <h1>Computer <span class="highlight">Short Courses</span></h1>
            <p>Learn computer skills online — Get Certified!</p>

            <div class="coming-badge">
                <i class="fas fa-clock"></i> Coming Soon
            </div>

            <p style="margin-top: 16px; font-size: 0.9rem; color: #888;">
                We're building an amazing online learning platform.
            </p>

            <div class="back-home">
                <a href="index.html">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

</body>
</html>
